name: CanMV K230 Build for Release

on:
  push:
    tags: [ "v*" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out firmware sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Environment
        run: |
          sudo apt update
          sudo apt install -y bison flex gcc libncurses5-dev pkg-config \
            libconfuse-dev libssl-dev python3 python3-pip python-is-python3 python3-venv \
            cmake libyaml-dev scons mtools bzip2
          python3 -m venv ~/.canmv_venv
          source ~/.canmv_venv/bin/activate
          pip3 install pycryptodome gmssl jsonschema jinja2 toml

      - name: Download toolchains
        run: |
          make dl_toolchain TOOLCHAIN=rtsmart

      - name: Build Projects
        run: |
          export SKIP_TOOLCHAIN_CHECK=1
          source ~/.canmv_venv/bin/activate
          projects=(
            "k230_rtos_01studio_defconfig"
            "k230_rtos_lckfb_defconfig"
          )
          echo "Config list is ${projects}"
          for proj in ${projects[@]};do
            echo "-------------------"
            echo "build project ${proj}"
            echo "-------------------"
            make ${proj} ENABLE_ALL_SAMPLES=1
            time make -j8
            echo "-------------------"
          done

      - name: Record source revision
        run: git rev-parse HEAD > SOURCE_REVISION.txt

      - name: Upload images to Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            SOURCE_REVISION.txt
            output/**/*.img.gz
            output/**/*.img.gz.md5
          generate_release_notes: true
